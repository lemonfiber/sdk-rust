documentation:
  - changed-files:
      - any-glob-to-any-file: ['**/*.md', '.docs/**']
ci:
  - changed-files:
      - any-glob-to-any-file: ['.github/workflows/**', 'justfile']
dependencies:
  - changed-files:
      - any-glob-to-any-file: ['Cargo.toml', 'Cargo.lock', '**/Cargo.toml', 'deny.toml', '.github/dependabot.yml']
