# Read by the SonarQube Cloud scan `sonar.yml` runs, which analyses this tree and
# reads the report its `coverage` job wrote.
sonar.projectKey=lemonfiber_sdk-rust
sonar.organization=lemonfiber

# The two crates and the workflows. `scripts/` is left out: its one file is a copy of
# the spec's `shared/gates/no_open_codeql_alert.py`, analysed at its home. The
# generated contract module is rewritten whole by `just generate`, so a finding there
# cannot be fixed where it is reported; the generator is analysed in its place. The
# tests are named as tests and kept out of the sources, so no file is indexed twice.
sonar.sources=crates,.github
sonar.exclusions=crates/lemonfiber-sdk/src/contract/**,**/tests.rs,**/tests/**
sonar.tests=crates
sonar.test.inclusions=**/tests.rs,**/tests/**
